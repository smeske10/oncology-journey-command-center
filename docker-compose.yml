services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ojcc
      POSTGRES_USER: ojcc
      POSTGRES_PASSWORD: local-synthetic-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ojcc -d ojcc"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - ojcc-postgres:/var/lib/postgresql/data

volumes:
  ojcc-postgres:
