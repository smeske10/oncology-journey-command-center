name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install --require-hashes -r ./services/api/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./services/api
      - run: npx --workspace apps/web playwright install --with-deps chromium
      - shell: pwsh
        run: ./scripts/verify.ps1
