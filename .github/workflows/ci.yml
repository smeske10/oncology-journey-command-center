name: Verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ojcc
          POSTGRES_PASSWORD: local-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ojcc -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.js', 'apps/web/**/*.jsx', 'apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: python -m pip install --require-hashes -r ./services/api/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./services/api
      - name: Create owned disposable verification databases
        shell: pwsh
        run: |
          @'
          import os
          import re
          from urllib.parse import quote
          from uuid import uuid4

          import psycopg
          from psycopg import sql

          bootstrap_user = "ojcc"
          bootstrap_password = "local-synthetic-only"
          migration_user = "ojcc_migrator"
          migration_password = "migrator-ci-synthetic-only"
          application_user = "ojcc_api"
          application_password = "api-ci-synthetic-only"
          names = tuple(f"ojcc_demo_{uuid4().hex}" for _ in range(2))
          if names[0] == names[1]:
              raise SystemExit("API and live verification databases must be different")

          maintenance_url = (
              f"postgresql://{bootstrap_user}:{bootstrap_password}@127.0.0.1:5432/postgres"
          )
          with psycopg.connect(maintenance_url, autocommit=True) as connection:
              with connection.cursor() as cursor:
                  expected_roles = {
                      migration_user: (True, True, False, False, False, False, True),
                      application_user: (True, False, False, False, False, False, True),
                      "ojcc_app": (False, False, False, False, False, False, True),
                  }
                  passwords = {
                      migration_user: migration_password,
                      application_user: application_password,
                  }
                  for role, expected in expected_roles.items():
                      row = cursor.execute(
                          "SELECT rolcanlogin, rolcreatedb, rolcreaterole, rolsuper, "
                          "rolreplication, rolbypassrls, rolinherit FROM pg_roles "
                          "WHERE rolname = %s",
                          (role,),
                      ).fetchone()
                      if row is None:
                          login = sql.SQL("LOGIN") if expected[0] else sql.SQL("NOLOGIN")
                          createdb = sql.SQL("CREATEDB") if expected[1] else sql.SQL("NOCREATEDB")
                          password = (
                              sql.SQL(" PASSWORD {} ").format(sql.Literal(passwords[role]))
                              if role in passwords
                              else sql.SQL(" ")
                          )
                          cursor.execute(
                              sql.SQL(
                                  "CREATE ROLE {} {} {} NOCREATEROLE NOSUPERUSER "
                                  "NOREPLICATION NOBYPASSRLS INHERIT{}"
                              ).format(
                                  sql.Identifier(role), login, createdb, password
                              )
                          )
                      elif tuple(row) != expected:
                          raise SystemExit(f"Existing role has unexpected properties: {role}")

                  membership = cursor.execute(
                      "SELECT m.inherit_option, m.set_option, m.admin_option "
                      "FROM pg_auth_members AS m "
                      "JOIN pg_roles AS granted ON granted.oid = m.roleid "
                      "JOIN pg_roles AS member ON member.oid = m.member "
                      "WHERE granted.rolname = 'ojcc_app' AND member.rolname = %s",
                      (application_user,),
                  ).fetchone()
                  if membership is None:
                      cursor.execute(
                          sql.SQL(
                              "GRANT {} TO {} WITH INHERIT TRUE, SET FALSE, ADMIN FALSE"
                          ).format(
                              sql.Identifier("ojcc_app"), sql.Identifier(application_user)
                          )
                      )
                  elif tuple(membership) != (True, False, False):
                      raise SystemExit("Existing ojcc_app membership has unexpected options")

                  for name in names:
                      if re.fullmatch(r"ojcc_demo_[0-9a-f]{32}", name) is None:
                          raise SystemExit("Generated an unsafe disposable database name")
                      if cursor.execute(
                          "SELECT 1 FROM pg_database WHERE datname = %s", (name,)
                      ).fetchone() is not None:
                          raise SystemExit("Refusing to reuse a disposable database")
                      cursor.execute(
                          sql.SQL("CREATE DATABASE {} OWNER {}").format(
                              sql.Identifier(name), sql.Identifier(migration_user)
                          )
                      )

          def database_url(user, password, name):
              return (
                  f"postgresql+psycopg://{quote(user)}:{quote(password)}"
                  f"@127.0.0.1:5432/{name}"
              )

          values = {
              "API_DATABASE_NAME": names[0],
              "LIVE_DATABASE_NAME": names[1],
              "BOOTSTRAP_DATABASE_URL": database_url(
                  bootstrap_user, bootstrap_password, names[0]
              ),
              "MIGRATION_DATABASE_URL": database_url(
                  migration_user, migration_password, names[0]
              ),
              "DATABASE_URL": database_url(
                  application_user, application_password, names[0]
              ),
              "LIVE_BOOTSTRAP_DATABASE_URL": database_url(
                  bootstrap_user, bootstrap_password, names[1]
              ),
              "LIVE_MIGRATION_DATABASE_URL": database_url(
                  migration_user, migration_password, names[1]
              ),
              "LIVE_DATABASE_URL": database_url(
                  application_user, application_password, names[1]
              ),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              for key, value in values.items():
                  environment.write(f"{key}={value}\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Disposable database creation failed" }
      - name: Replay and seed API verification database
        shell: pwsh
        run: >-
          ./scripts/reset_demo.ps1
          -BootstrapDatabaseUrl $env:BOOTSTRAP_DATABASE_URL
          -MigrationDatabaseUrl $env:MIGRATION_DATABASE_URL
          -DatabaseUrl $env:DATABASE_URL
          -ConfirmDatabaseName $env:API_DATABASE_NAME
      - run: npx --workspace apps/web playwright install --with-deps chromium
      - shell: pwsh
        run: >-
          ./scripts/verify.ps1
          -LiveBootstrapDatabaseUrl $env:LIVE_BOOTSTRAP_DATABASE_URL
          -LiveMigrationDatabaseUrl $env:LIVE_MIGRATION_DATABASE_URL
          -LiveDatabaseUrl $env:LIVE_DATABASE_URL
          -LiveConfirmDatabaseName $env:LIVE_DATABASE_NAME
