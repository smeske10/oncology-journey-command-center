name: Verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      API_DATABASE_NAME: ojcc_demo_c1a0000000000001
      LIVE_DATABASE_NAME: ojcc_demo_c1a0000000000002
      DATABASE_URL: postgresql+psycopg://ojcc:local-synthetic-only@127.0.0.1:5432/ojcc_demo_c1a0000000000001
      LIVE_DATABASE_URL: postgresql+psycopg://ojcc:local-synthetic-only@127.0.0.1:5432/ojcc_demo_c1a0000000000002
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ojcc
          POSTGRES_PASSWORD: local-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ojcc -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.js', 'apps/web/**/*.jsx', 'apps/web/**/*.ts', 'apps/web/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: python -m pip install --require-hashes -r ./services/api/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./services/api
      - name: Create owned disposable verification databases
        shell: pwsh
        run: |
          @'
          import os
          import re
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          names = (os.environ["API_DATABASE_NAME"], os.environ["LIVE_DATABASE_NAME"])
          if names[0] == names[1]:
              raise SystemExit("API and live verification databases must be different")
          for name in names:
              if re.fullmatch(r"ojcc_demo_[0-9a-f]{8,32}", name) is None:
                  raise SystemExit(f"Unsafe disposable database name: {name}")

          admin_url = make_url(os.environ["DATABASE_URL"]).set(database="postgres")
          engine = create_engine(admin_url, isolation_level="AUTOCOMMIT")
          try:
              with engine.connect() as connection:
                  for name in names:
                      exists = connection.scalar(
                          text("SELECT 1 FROM pg_database WHERE datname = :name"),
                          {"name": name},
                      )
                      if exists:
                          raise SystemExit(f"Refusing to reuse disposable database: {name}")
                      connection.execute(text(f'CREATE DATABASE "{name}"'))
          finally:
              engine.dispose()
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Disposable database creation failed" }
      - run: python -m alembic -c services/api/alembic.ini upgrade head
      - run: npx --workspace apps/web playwright install --with-deps chromium
      - shell: pwsh
        run: >-
          ./scripts/verify.ps1
          -LiveDatabaseUrl $env:LIVE_DATABASE_URL
          -LiveConfirmDatabaseName $env:LIVE_DATABASE_NAME
