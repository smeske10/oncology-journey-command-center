name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ojcc:local-synthetic-only@127.0.0.1:5432/ojcc
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ojcc
          POSTGRES_USER: ojcc
          POSTGRES_PASSWORD: local-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ojcc -d ojcc"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install --require-hashes -r ./services/api/requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e ./services/api
      - run: python -m alembic -c services/api/alembic.ini upgrade head
      - run: npx --workspace apps/web playwright install --with-deps chromium
      - shell: pwsh
        run: ./scripts/verify.ps1
